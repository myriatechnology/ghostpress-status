name: keepalive

# GitHub turns off a public repository's scheduled workflows after 60 days without a
# commit. The probe deploys but never commits, so this records one commit a month.
on:
  schedule:
    - cron: "17 6 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Commit the date
        run: |
          date -u +%Y-%m-%dT%H:%M:%SZ > .keepalive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .keepalive
          git commit -m "chore: keepalive"
          git push
